    <div class="container">
        <h1>Edit Profile</h1>
        <form id="edit-profile-form">
            <label for="profile-name">Profile Name:</label>
            <input type="text" id="profile-name" name="profile-name" required>
            
            <label>Profile Picture:</label>
            <div>
                <input type="radio" id="profile-picture-url-option" name="profile-picture-option" value="url" checked>
                <label for="profile-picture-url-option">Use URL:</label>
